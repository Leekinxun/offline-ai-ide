services:
  ai-ide:
    image: ai-ide:latest          # 构建出来的镜像名和标签
    container_name: crownforge        # 容器名
    build:
      context: .
      pull: false                 # 明确构建时不去拉取基础镜像的更新（按需保留，通常建议加上）
    pull_policy: never            # 核心配置：明确声明永远不拉取远程镜像
    ports:
      - "9798:3000"
    volumes:
      - ./workspace:/workspace
      - ./plugins:/app/plugins
    environment:
      # LLM API (OpenAI-compatible: vLLM / OpenAI / DeepSeek / etc.)
      - VLLM_API_URL=http://host.docker.internal:8000/v1
      - VLLM_API_KEY=
      - MODEL_NAME=default
      # Workspace
      - WORKSPACE_DIR=/workspace
      # Agent tuning (optional)
      - MAX_AGENT_ITERATIONS=30
      - AGENT_MAX_TOKENS=8192
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
