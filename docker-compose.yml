services:
  crownforge-permissions:
    image: ai-ide:latest
    command: ["init-mounts"]
    user: "0:0"
    volumes:
      - ./workspace:/workspace:rw
      - ./plugins:/app/plugins:rw
      - crewforge-config:/app/config:rw
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    environment:
      - CROWNFORGE_UID=${CROWNFORGE_UID:-10001}
      - CROWNFORGE_GID=${CROWNFORGE_GID:-10001}
    restart: "no"

  ai-ide:
    image: ai-ide:latest          # 构建出来的镜像名和标签
    container_name: crownforge        # 容器名
    build:
      context: .
      # Keep the build mapping compatible with both docker-compose v1 and
      # docker compose v2. Refresh base images explicitly with `build --pull`.
    ports:
      - "9798:3000"
    volumes:
      # The entrypoint initializes bind-mount ownership before dropping to the
      # configured non-root UID/GID.
      - ./workspace:/workspace:rw
      - ./plugins:/app/plugins:rw
      - crewforge-config:/app/config:rw
    user: "${CROWNFORGE_UID:-10001}:${CROWNFORGE_GID:-10001}"
    depends_on:
      - crownforge-permissions
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      - /run:rw,nosuid,size=16m,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 2g
    cpus: "2.0"
    init: true
    environment:
      # LLM API (OpenAI-compatible: vLLM / OpenAI / DeepSeek / etc.)
      - VLLM_API_URL=http://host.docker.internal:8000/v1
      - VLLM_API_KEY=
      - MODEL_NAME=default
      # Workspace
      - WORKSPACE_DIR=/workspace
      - TEAM_STORE_ROOT=/app/config
      - CROWNFORGE_UID=${CROWNFORGE_UID:-10001}
      - CROWNFORGE_GID=${CROWNFORGE_GID:-10001}
      # Agent tuning (optional)
      - MAX_AGENT_ITERATIONS=30
      - AGENT_CONTEXT_COMPACT_THRESHOLD=60000
      # External MCP endpoints (comma-separated; can also be managed in admin Settings)
      - MCP_BASE_URLS=
      - MCP_LAZY_URLS=
      - MCP_DISABLED_URLS=
      - MCP_TIMEOUT=60
      - MCP_CONNECT_TIMEOUT=10
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:3000/api/health | grep -q '\"status\":\"ok\"'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  crewforge-config:
