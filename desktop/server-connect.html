<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrownForge - 连接到服务端</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 32px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }
    .logo {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
    }
    .title-group h1 {
      font-size: 20px;
      font-weight: 600;
      color: #f8fafc;
    }
    .title-group p {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .desc {
      font-size: 13px;
      line-height: 1.6;
      color: #cbd5e1;
      margin-bottom: 24px;
      background: rgba(15, 23, 42, 0.6);
      padding: 12px 14px;
      border-radius: 8px;
      border-left: 3px solid #38bdf8;
    }
    .field {
      margin-bottom: 20px;
    }
    .field label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #cbd5e1;
      margin-bottom: 8px;
    }
    .input-wrapper {
      position: relative;
    }
    input[type="text"] {
      width: 100%;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 14px;
      color: #f8fafc;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input[type="text"]:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }
    .status-box {
      min-height: 24px;
      font-size: 13px;
      margin-bottom: 20px;
      padding: 8px 12px;
      border-radius: 6px;
      display: none;
    }
    .status-box.success {
      display: block;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid #22c55e;
      color: #4ade80;
    }
    .status-box.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #f87171;
    }
    .status-box.info {
      display: block;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid #38bdf8;
      color: #7dd3fc;
    }
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }
    button {
      border: none;
      border-radius: 6px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: #334155;
      color: #f1f5f9;
    }
    .btn-secondary:hover:not(:disabled) {
      background: #475569;
    }
    .btn-primary {
      background: #0284c7;
      color: #ffffff;
    }
    .btn-primary:hover:not(:disabled) {
      background: #0369a1;
    }
    .tip {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #334155;
      font-size: 12px;
      color: #64748b;
      line-height: 1.5;
    }
    .tip code {
      background: #0f172a;
      padding: 2px 5px;
      border-radius: 4px;
      color: #94a3b8;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <svg class="logo" viewBox="0 0 32 32" fill="none">
        <rect width="32" height="32" rx="8" fill="#0284c7" />
        <path d="M7 16L12 9L16 14L20 9L25 16V23H7V16Z" fill="#ffffff" />
      </svg>
      <div class="title-group">
        <h1>CrownForge 桌面客户端</h1>
        <p>连接到 Web 远程服务端 · 瘦客户端模式</p>
      </div>
    </div>

    <div class="desc">
      当前客户端免去了本地启动 Node 服务和沙箱运行时的依赖。请输入已在内网部署的 CrownForge 服务端地址：
    </div>

    <div class="field">
      <label for="serverInput">服务端地址 (URL)</label>
      <div class="input-wrapper">
        <input type="text" id="serverInput" placeholder="http://192.168.1.100:3000" spellcheck="false" autocomplete="off" />
      </div>
    </div>

    <div id="statusBox" class="status-box"></div>

    <div class="actions">
      <button id="testBtn" type="button" class="btn-secondary">测试连接</button>
      <button id="connectBtn" type="button" class="btn-primary">保存并连接</button>
    </div>

    <div class="tip">
      <strong>便捷提示：</strong> 也可在程序同级目录下放置 <code>server.json</code> 文件（内容如 <code>{"serverUrl": "http://IP:端口"}</code>），下次启动将自动免配置连接。
    </div>
  </div>

  <script>
    const input = document.getElementById("serverInput");
    const testBtn = document.getElementById("testBtn");
    const connectBtn = document.getElementById("connectBtn");
    const statusBox = document.getElementById("statusBox");

    function setStatus(type, message) {
      statusBox.className = "status-box " + type;
      statusBox.textContent = message;
    }

    function clearStatus() {
      statusBox.className = "status-box";
      statusBox.textContent = "";
    }

    async function init() {
      if (window.crownforgeServer) {
        try {
          const config = await window.crownforgeServer.getConfig();
          if (config && config.serverUrl) {
            input.value = config.serverUrl;
          }
        } catch {}
      }
      input.focus();
    }

    async function handleTest() {
      const url = input.value.trim();
      if (!url) {
        setStatus("error", "请输入服务端 URL 地址");
        return;
      }
      clearStatus();
      testBtn.disabled = true;
      setStatus("info", "正在探测服务端连通性...");

      try {
        if (!window.crownforgeServer) throw new Error("环境桥接未就绪");
        const res = await window.crownforgeServer.testConnection(url);
        if (res.ok) {
          setStatus("success", "连接成功！服务端运行正常 (HTTP " + (res.status || 200) + ")");
        } else {
          setStatus("error", "连接失败：" + (res.error || "无法访问指定服务端口"));
        }
      } catch (err) {
        setStatus("error", "测试出错：" + (err.message || String(err)));
      } finally {
        testBtn.disabled = false;
      }
    }

    async function handleConnect() {
      const url = input.value.trim();
      if (!url) {
        setStatus("error", "请输入服务端 URL 地址");
        return;
      }
      clearStatus();
      connectBtn.disabled = true;
      setStatus("info", "正在保存并建立连接...");

      try {
        if (!window.crownforgeServer) throw new Error("环境桥接未就绪");
        const res = await window.crownforgeServer.saveAndConnect(url);
        if (res && res.error) {
          setStatus("error", "保存失败：" + res.error);
          connectBtn.disabled = false;
        }
      } catch (err) {
        setStatus("error", "发生异常：" + (err.message || String(err)));
        connectBtn.disabled = false;
      }
    }

    testBtn.addEventListener("click", handleTest);
    connectBtn.addEventListener("click", handleConnect);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleConnect();
    });

    init();
  </script>
</body>
</html>
